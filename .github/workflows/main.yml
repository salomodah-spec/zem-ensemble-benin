
name: Construire APK Android

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dependances
        run: npm install

      - name: Prepararer les fichiers web
        run: |
          mkdir -p www/icons
          cp index.html app.js sw.js manifest.webmanifest www/
          cp icon.svg www/icons/icon.svg
          sed -i 's/bj.zemensemble.app/com.zemensemble.benin/' capacitor.config.json

      - name: Creer le projet Android
        run: npx cap add android

      - name: Synchroniser Android
        run: npx cap sync android

      - name: Construire APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Recuperer le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: Zem-Ensemble-Benin-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
